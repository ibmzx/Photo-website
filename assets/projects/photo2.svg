  <!-- Grid Perspective Lines -->
  <line x1="0" y1="320" x2="600" y2="320" stroke="#a855f7" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="360" x2="600" y2="360" stroke="#c084fc" stroke-width="1.5" opacity="0.5"/>
  <text x="40" y="60" fill="#a855f7" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="3">CYBERPUNK CITYSCAPE</text>
</svg>