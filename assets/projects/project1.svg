<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12111d"/>
      <stop offset="100%" stop-color="#07060a"/>
    </linearGradient>
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#d8b4fe"/>
    </linearGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bgGrad1)"/>

  <!-- Grid Lines -->
  <g stroke="#261b3d" stroke-width="1" opacity="0.4">
    <path d="M0 50 H600 M0 100 H600 M0 150 H600 M0 200 H600 M0 250 H600 M0 300 H600 M0 350 H600" />
    <path d="M50 0 V400 M100 0 V400 M150 0 V400 M200 0 V400 M250 0 V400 M300 0 V400 M350 0 V400 M400 0 V400 M450 0 V400 M500 0 V400 M550 0 V400" />
  </g>

  <!-- UI Window Mockup -->
  <rect x="50" y="40" width="500" height="320" rx="12" fill="#181528" stroke="#3b2d54" stroke-width="2"/>
  <!-- Top bar -->
  <path d="M50 40 h500 v30 h-500 z" fill="#0f0c1b"/>
  <circle cx="75" cy="55" r="5" fill="#ef4444"/>
  <circle cx="92" cy="55" r="5" fill="#eab308"/>
  <circle cx="109" cy="55" r="5" fill="#22c55e"/>

  <!-- Sidebar & Cards -->
  <rect x="70" y="90" width="100" height="250" rx="6" fill="#110d21"/>
  <rect x="185" y="90" width="345" height="110" rx="6" fill="#201838"/>

  <!-- Glowing Chart Line -->
  <path d="M 200 170 Q 250 120, 290 150 T 380 110 T 470 130 T 510 100" fill="none" stroke="url(#accentGrad1)" stroke-width="4" filter="url(#neonGlow)"/>
  <circle cx="510" cy="100" r="6" fill="#e9d5ff" filter="url(#neonGlow)"/>

  <!-- Lower Widgets -->
  <rect x="185" y="215" width="165" height="125" rx="6" fill="#130e26" stroke="#9333ea" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="365" y="215" width="165" height="125" rx="6" fill="#130e26" stroke="#9333ea" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Floating Text Badge -->
  <rect x="205" y="235" width="80" height="12" rx="4" fill="#a855f7" opacity="0.8"/>
  <rect x="205" y="260" width="120" height="8" rx="3" fill="#4c1d95"/>
  <rect x="205" y="278" width="100" height="8" rx="3" fill="#4c1d95"/>
</svg>
