<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05030a"/>
      <stop offset="50%" stop-color="#15082a"/>
      <stop offset="100%" stop-color="#280945"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#p3Bg)"/>
  <!-- Modern Geometric Architecture -->
  <polygon points="100,400 250,50 350,50 500,400" fill="#0c051a" stroke="#a855f7" stroke-width="2"/>
  <line x1="250" y1="50" x2="250" y2="400" stroke="#c084fc" stroke-width="1.5" opacity="0.6"/>
  <line x1="350" y1="50" x2="350" y2="400" stroke="#c084fc" stroke-width="1.5" opacity="0.6"/>
  <!-- Glass facets reflection lines -->
  <polygon points="250,50 350,50 310,220 250,50" fill="#a855f7" opacity="0.25"/>
  <polygon points="350,50 500,400 380,400 350,50" fill="#c084fc" opacity="0.15"/>
  <!-- Starburst night sky element -->
  <circle cx="300" cy="50" r="4" fill="#ffffff"/>
  <circle cx="300" cy="50" r="15" fill="#e9d5ff" opacity="0.5"/>
  <text x="40" y="360" fill="#e9d5ff" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="3">ARCHITECTURAL NIGHT</text>
</svg>