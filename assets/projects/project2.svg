<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#161224"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="neonGlow2">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bgGrad2)"/>

  <!-- Phone Frames Mockup -->
  <g transform="translate(140, 40)">
    <!-- Back Phone -->
    <rect x="140" y="30" width="150" height="290" rx="20" fill="#1b172e" stroke="#581c87" stroke-width="3"/>

    <!-- Front Phone -->
    <rect x="40" y="10" width="160" height="310" rx="22" fill="#0f0c1b" stroke="url(#purpleGlow)" stroke-width="3" filter="url(#neonGlow2)"/>
    <rect x="50" y="22" width="140" height="286" rx="16" fill="#17122b"/>
    <!-- Dynamic Island / Notch -->
    <rect x="95" y="30" width="50" height="12" rx="6" fill="#090710"/>

    <!-- UI Cards in Mobile -->
    <rect x="62" y="58" width="116" height="50" rx="10" fill="url(#purpleGlow)"/>
    <rect x="62" y="118" width="116" height="70" rx="10" fill="#241b3f"/>
    <rect x="62" y="198" width="116" height="40" rx="8" fill="#241b3f"/>
    <rect x="62" y="246" width="116" height="40" rx="8" fill="#241b3f"/>

    <!-- Abstract glowing element -->
    <circle cx="120" cy="153" r="18" fill="#c084fc" opacity="0.8" filter="url(#neonGlow2)"/>
  </g>
</svg>
