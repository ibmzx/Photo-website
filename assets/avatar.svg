<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120c1f"/>
      <stop offset="50%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#07070a"/>
    </linearGradient>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e9d5ff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="400" height="400" fill="url(#bgGlow)"/>

  <!-- Outer Glow Ring -->
  <circle cx="200" cy="200" r="170" stroke="url(#purpleGradient)" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="6, 6"/>
  <circle cx="200" cy="200" r="155" stroke="#a855f7" stroke-width="3" fill="none" opacity="0.8" filter="url(#neonShadow)"/>

  <!-- Stylized Photographer Silhouette -->
  <!-- Head & Shoulders -->
  <path d="M120 330 C 120 270, 150 250, 200 250 C 250 250, 280 270, 280 330 Z" fill="#2e1065"/>
  <circle cx="200" cy="160" r="45" fill="#3b0764"/>

  <!-- Camera overlay -->
  <g transform="translate(145, 175)">
    <!-- Camera Body -->
    <rect x="0" y="20" width="110" height="70" rx="10" fill="#1e1b2e" stroke="url(#purpleGradient)" stroke-width="3" filter="url(#neonShadow)"/>
    <!-- Flash Mount / Top bump -->
    <path d="M 35 20 L 45 8 L 65 8 L 75 20 Z" fill="#2e1065" stroke="#a855f7" stroke-width="2"/>
    <!-- Shutter Button -->
    <rect x="15" y="12" width="12" height="8" rx="2" fill="#c084fc"/>
    <!-- Outer Lens Ring -->
    <circle cx="55" cy="55" r="28" fill="#090514" stroke="url(#purpleGradient)" stroke-width="3"/>
    <!-- Inner Lens Reflection -->
    <circle cx="55" cy="55" r="20" fill="url(#lensGlow)"/>
    <!-- Lens aperture blade accents -->
    <circle cx="55" cy="55" r="10" fill="#a855f7" opacity="0.8"/>
  </g>

  <!-- Sparkles / Flash Lights -->
  <path d="M265 175 L270 160 L275 175 L290 180 L275 185 L270 200 L265 185 L250 180 Z" fill="#e9d5ff" opacity="0.9" filter="url(#neonShadow)"/>
  <circle cx="80" cy="120" r="3" fill="#c084fc" opacity="0.7"/>
  <circle cx="320" cy="100" r="4" fill="#a855f7" opacity="0.8"/>
  <circle cx="330" cy="280" r="2.5" fill="#e9d5ff" opacity="0.6"/>
</svg>