<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="avatarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#9333ea" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="400" height="400" fill="#0d0d12" rx="20"/>
  <circle cx="200" cy="200" r="180" fill="url(#avatarGlow)"/>

  <!-- Outer Neon Ring -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="url(#purpleGradient)" stroke-width="4" filter="url(#glow)"/>
  <circle cx="200" cy="200" r="130" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="10 15"/>

  <!-- Abstract Tech Silhouette / Avatar Icon -->
  <g transform="translate(100, 80)">
    <!-- Head -->
    <circle cx="100" cy="80" r="45" fill="url(#purpleGradient)"/>
    <!-- Sci-fi Visor/Glasses -->
    <path d="M 65 75 Q 100 65 135 75 Q 135 90 100 92 Q 65 90 65 75 Z" fill="#0d0d12" stroke="#e9d5ff" stroke-width="2"/>
    <line x1="75" y1="83" x2="125" y2="83" stroke="#c084fc" stroke-width="3" filter="url(#glow)"/>

    <!-- Body / Shoulders -->
    <path d="M 20 200 C 20 140, 60 140, 100 140 C 140 140, 180 140, 180 200 Z" fill="url(#purpleGradient)" opacity="0.9"/>
    <path d="M 40 200 C 40 155, 70 155, 100 155 C 130 155, 160 155, 160 200 Z" fill="#12111a"/>
  </g>

  <!-- Code elements floating -->
  <text x="35" y="100" fill="#a855f7" font-family="monospace" font-size="14" opacity="0.7">&lt;dev&gt;</text>
  <text x="310" y="310" fill="#c084fc" font-family="monospace" font-size="14" opacity="0.7">&lt;/code&gt;</text>
</svg>
